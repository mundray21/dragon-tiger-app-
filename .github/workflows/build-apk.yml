name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Project Folder Structure
      run: |
        # Lilinisin at itatama nito ang nagpatong-patong na folders bago mag-build
        mkdir -p app/src/main/res/xml
        if [ -f app/src/main/res/xml/app/src/main/AndroidManifest.xml ]; then
          cp app/src/main/res/xml/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
        elif [ -f AndroidManifest.xml ]; then
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK directly
      run: gradle assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: dragon-tiger-app-file
        path: app/build/outputs/apk/debug/app-debug.apk
